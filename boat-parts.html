<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Keelboat Parts Explorer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: the 3D scene is the page; UI floats on it in two docks (parts list left, part card bottom-right),
   collapsing on phones to a top chip bar and a bottom sheet (right-side sheet in landscape). */
:root{
  --bg:#0b1622; --panel:rgba(14,26,40,.86); --panel-solid:#101d2c; --line:rgba(170,200,230,.16);
  --fg:#eef4fa; --muted:#9fb3c8; --accent:#ffb347; --accent-ink:#1a1200; --sel:#ffd27a;
  --good:#5fd38d; --bad:#ff6b6b; --chip:rgba(255,255,255,.08); --chip-on:#ffb347;
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#dfe9f2; --panel:rgba(248,251,254,.9); --panel-solid:#f7fafd; --line:rgba(20,50,80,.14);
  --fg:#10202f; --muted:#52677c; --accent:#c8641a; --accent-ink:#fff; --sel:#d97b2b;
  --good:#1f8f4e; --bad:#c43c3c; --chip:rgba(10,40,70,.07); --chip-on:#c8641a; color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#dfe9f2; --panel:rgba(248,251,254,.9); --panel-solid:#f7fafd; --line:rgba(20,50,80,.14);
  --fg:#10202f; --muted:#52677c; --accent:#c8641a; --accent-ink:#fff; --sel:#d97b2b;
  --good:#1f8f4e; --bad:#c43c3c; --chip:rgba(10,40,70,.07); --chip-on:#c8641a; color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;flex-direction:column;line-height:1.05;margin-right:6px}
.brand b{font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.02em;text-transform:uppercase}
.brand small{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.chips{display:flex;gap:6px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:4px}
.chip{padding:6px 14px;border-radius:999px;font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--accent-ink)}
.ibtn{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);display:grid;place-items:center;font-family:var(--display);font-size:13px;letter-spacing:.05em}
.ibtn[aria-pressed="true"]{background:var(--chip-on);color:var(--accent-ink)}
.spacer{flex:1}
#hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;z-index:4;pointer-events:none;transition:opacity .5s;white-space:nowrap}

/* parts list dock */
#list{position:fixed;left:16px;top:calc(72px + env(safe-area-inset-top,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:250px;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;z-index:4;overflow:hidden}
#list header{padding:12px 14px 8px;font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#list .scroll{overflow-y:auto;flex:1;padding:6px 8px 10px}
.grp{margin:8px 0 2px;padding:0 6px;font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.pbtn{display:flex;width:100%;text-align:left;padding:6px 8px;border-radius:8px;gap:8px;align-items:center;font-size:14px}
.pbtn:hover{background:var(--chip)}
.pbtn[aria-current="true"]{background:var(--chip-on);color:var(--accent-ink);font-weight:700}
.pbtn .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px;width:18px}
.pbtn[aria-current="true"] .n{color:inherit}
.pbtn.done .n::after{content:"✓"}

/* part card */
#card{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:16px 18px 14px;z-index:4;display:flex;flex-direction:column;gap:8px;max-height:min(62vh,520px);overflow:auto}
#card .eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
#card h2{font-family:var(--display);font-weight:500;font-size:27px;line-height:1.05;margin:0;text-wrap:balance}
#card h2 small{font-size:14px;color:var(--muted);font-family:var(--body);font-weight:400;display:block;margin-top:3px}
#card p{margin:0;font-size:14.5px}
#card .lbl{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:4px}
#card .tip{border-left:3px solid var(--accent);padding:4px 10px;font-size:13.5px;color:var(--muted);font-style:italic}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn{padding:8px 14px;border-radius:10px;background:var(--chip);border:1px solid var(--line);font-family:var(--display);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn:disabled{opacity:.4;cursor:default}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;margin-left:auto}

/* quiz */
.opts{display:grid;gap:6px;margin-top:4px}
.opt{text-align:left;padding:9px 12px;border-radius:10px;background:var(--chip);border:1px solid var(--line);font-size:14px}
.opt:hover{border-color:var(--accent)}
.opt.ok{background:color-mix(in srgb,var(--good) 25%,transparent);border-color:var(--good)}
.opt.no{background:color-mix(in srgb,var(--bad) 25%,transparent);border-color:var(--bad)}
.feed{font-weight:700}
.feed.ok{color:var(--good)} .feed.no{color:var(--bad)}
.score{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}

/* mobile */
#listToggle{display:none}
@media (max-width:900px), (pointer:coarse) and (max-height:600px){
  body{font-size:14px}
  #top{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));gap:6px}
  .brand small{display:none}.brand b{font-size:16px}
  .chip{padding:5px 10px;font-size:12.5px}
  #hint{top:calc(56px + env(safe-area-inset-top,0px));font-size:11.5px;max-width:calc(100vw - 32px);white-space:normal;text-align:center}
  #listToggle{display:grid}
  #list{left:10px;top:calc(58px + env(safe-area-inset-top,0px));bottom:auto;max-height:min(60vh,420px);width:min(240px,calc(100vw - 20px));transform:translateX(-120%);opacity:0;transition:transform .25s,opacity .25s}
  #list.open{transform:none;opacity:1}
  #card{right:10px;left:10px;width:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:12px 14px 10px;max-height:44vh;gap:5px}
  #card h2{font-size:22px}
  #card p{font-size:13.5px}
}
@media (pointer:coarse) and (orientation:landscape) and (max-height:600px){
  #card{left:auto;right:calc(10px + env(safe-area-inset-right,0px));top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(46vw,380px);max-height:calc(100vh - 68px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  #top{padding-left:calc(10px + env(safe-area-inset-left,0px))}
  #list{left:calc(10px + env(safe-area-inset-left,0px));max-height:calc(100vh - 70px - env(safe-area-inset-top,0px))}
  #hint{left:calc(10px + env(safe-area-inset-left,0px));transform:none;max-width:48vw}
}
@media (max-width:520px){ .brand{display:none} .chip{padding:5px 9px;font-size:12px} .ibtn{width:34px;height:34px;font-size:12px} }
@media (pointer:coarse) and (orientation:landscape) and (max-height:600px){ #card h2{font-size:19px} #card p{font-size:12.5px} #card .tip{font-size:12px} .btn{padding:6px 11px;font-size:13px} }
#card.collapsed .body{display:none}
#card .grab{display:none}
@media (pointer:coarse){
  #card .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:-4px auto 2px}
}
@media (prefers-reduced-motion:reduce){ #list,#hint{transition:none} }
.sr{position:absolute;left:-9999px}
</style>

<div id="stage"></div>

<div id="top">
  <button class="ibtn" id="listToggle" aria-label="Parts list" aria-pressed="false">☰</button>
  <div class="brand"><b>Keelboat Parts</b><small>22-ft sloop · ASA 101</small></div>
  <div class="chips" role="tablist">
    <button class="chip" data-mode="explore" aria-pressed="true">Explore</button>
    <button class="chip" data-mode="tour" aria-pressed="false">Tour</button>
    <button class="chip" data-mode="quiz" aria-pressed="false">Quiz</button>
  </div>
  <div class="spacer"></div>
  <button class="ibtn" id="sailsBtn" aria-pressed="true" title="Show / hide sails">SAIL</button>
  <button class="ibtn" id="qualBtn" aria-pressed="true" title="Graphics quality: high">HQ</button>
</div>
<div id="hint">Drag to orbit · scroll or pinch to zoom · tap any part of the boat</div>

<aside id="list">
  <header><span>Parts of the boat</span><span id="count"></span></header>
  <div class="scroll" id="listScroll"></div>
</aside>

<section id="card" aria-live="polite">
  <div class="grab"></div>
  <div class="body" id="cardBody"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){ document.getElementById('cardBody').innerHTML='<p>The 3D library did not load. Check your connection and reload.</p>'; return; }

/* ───────────────────────── Part catalogue (ASA 101 vocabulary) ───────────────────────── */
const GROUPS=[['hull','Hull & underwater'],['deck','Deck & cockpit'],['spars','Mast & spars'],['standing','Standing rigging'],['running','Running rigging'],['sails','Sails']];
const PARTS=[
 {id:'hull',g:'hull',name:'Hull',sub:'the body of the boat',what:'The watertight body that gives the boat buoyancy. The front is the bow, the back is the stern, the widest point is the beam, and the flat aft face is the transom. Left side facing forward is port, right is starboard.',use:'Everything else is attached to it. The boot stripe shows the designed waterline; the dark paint below it is antifouling bottom paint.',tip:'Port and left both have four letters. Red is port, green is starboard.',view:{d:13,th:0.9,ph:1.25}},
 {id:'bow',g:'hull',name:'Bow & stem',sub:'forward end',what:'The pointed forward end of the hull. The stem is the leading edge where the two sides meet. The stemhead fitting here anchors the forestay and the jib tack.',use:'Cuts through the water. Direction words use it: forward, ahead and fore all point this way; "abaft" means toward the stern from something.',tip:'Jib tacks and anchor lines live here. The bow cleat is where a dock line or anchor rode is made fast.',view:{d:7,th:0.5,ph:1.3}},
 {id:'stern',g:'hull',name:'Stern & transom',sub:'aft end',what:'The aft end of the boat. The transom is the flat vertical surface closing the stern; on this boat the rudder hangs on it and the backstay ends above it.',use:'Reference for all "aft" and "astern" directions. The stern pulpit (pushpit) and stern cleats are here.',tip:'Astern = behind the boat. Going astern = backing up.',view:{d:7,th:3.1,ph:1.3}},
 {id:'keel',g:'hull',name:'Keel',sub:'fixed fin under the hull',what:'A heavy fin fixed under the hull, weighted with lead or iron. A 22-footer like this carries a fin keel or a swing keel of several hundred pounds.',use:'Two jobs: its weight (ballast) resists heeling and rights the boat, and its blade resists sideways slip (leeway) so the boat can sail upwind instead of skidding downwind.',tip:'ASA 101 boats are "keelboats" precisely because of this part; a dinghy uses a centerboard and crew weight instead.',view:{d:9,th:1.6,ph:2.0}},
 {id:'rudder',g:'hull',name:'Rudder',sub:'steering blade',what:'A vertical blade hung on the transom (or under the stern) that pivots on its gudgeons and pintles.',use:'Deflecting water past the rudder turns the boat. It only works when water is flowing over it, so a boat with no way on cannot be steered.',tip:'Lose the rudder and you can still steer with the sails: ease the main to bear away, trim it to head up.',view:{d:6,th:3.5,ph:1.7}},
 {id:'tiller',g:'deck',name:'Tiller',sub:'steering handle',what:'The lever attached to the top of the rudder that the helmsman holds. Many small keelboats add a hinged tiller extension so you can sit outboard.',use:'Push the tiller toward the sail (to leeward) and the bow turns up into the wind; pull it toward you (to windward) and the bow turns away.',tip:'"Tiller toward trouble": point the tiller at the thing you want to turn away from.',view:{d:5,th:2.6,ph:1.2}},
 {id:'cockpit',g:'deck',name:'Cockpit',sub:'where the crew sits',what:'The recessed well aft of the cabin with seats on each side and the coamings, the raised lips that keep water out. On this boat the winches, cleats and tiller are all within reach of it.',use:'The working area for steering and sail trim. Sit on the high (windward) side when heeled.',tip:'When tacking, the helmsman and crew swap sides across the cockpit as the boom crosses.',view:{d:7,th:2.4,ph:1.1}},
 {id:'cabin',g:'deck',name:'Cabin & companionway',sub:'the deckhouse',what:'The cabin trunk is the raised structure over the living space below. The companionway is the opening and ladder down into it, closed with a sliding hatch and drop boards (washboards).',use:'Shelter, storage and the step for the mast. Keep the drop boards in when it is rough so a wave cannot flood below.',tip:'Foredeck = deck forward of the mast. Side decks run along each side of the cabin.',view:{d:7,th:1.1,ph:1.15}},
 {id:'deck',g:'deck',name:'Deck',sub:'the top of the hull',what:'The surface you walk on, sealed to the hull at the sheer line (the top edge of the hull). It carries the non-skid, the hardware and the lifelines.',use:'Working platform. The foredeck is where you handle the jib and anchor; the side decks are the path forward.',tip:'"One hand for yourself, one for the boat" whenever you move along the deck.',view:{d:10,th:0.8,ph:0.9}},
 {id:'lifelines',g:'deck',name:'Lifelines, stanchions & pulpits',sub:'the fence around the deck',what:'Lifelines are wires running around the deck at knee height, held up by stanchions and ending at the bow pulpit and stern pulpit (pushpit), the stainless rails at each end.',use:'Keep crew aboard. Clip a harness tether to the boat, not the lifeline, in heavy weather.',tip:'Never stand on or lean hard against a lifeline; they are a last line of defense, not a handrail.',view:{d:8,th:0.7,ph:1.2}},
 {id:'winches',g:'deck',name:'Winches',sub:'the drums that multiply your pull',what:'Geared drums on the cockpit coamings. A line is wrapped clockwise around the drum, then tensioned with a winch handle.',use:'Give the crew mechanical advantage to trim the jib sheets (and sometimes halyards) under load.',tip:'Always wrap clockwise, keep fingers clear of the drum, and remove the handle when done.',view:{d:4.5,th:2.3,ph:1.25}},
 {id:'cleats',g:'deck',name:'Cleats',sub:'where lines are made fast',what:'Horn cleats (dock and anchor lines), cam and clutch cleats (sheets and halyards) spread across deck and cabin top.',use:'Secure a line so it holds without you. A horn cleat takes a full turn around the base, one or two figure-eights, then a locking half hitch.',tip:'A cleat hitch should be able to be released under load. Jam a line and you cannot ease it when a gust hits.',view:{d:5,th:0.5,ph:1.2}},
 {id:'traveler',g:'running',name:'Traveler',sub:'mainsheet track',what:'A track running across the boat with a sliding car; the lower mainsheet block rides on it.',use:'Moves the boom sideways without changing sheet tension, so you can control sail twist and depower in gusts by dropping the car to leeward.',tip:'Easing the traveler is the quick way to reduce heel without losing sail shape.',view:{d:5,th:3.0,ph:1.3}},
 {id:'mast',g:'spars',name:'Mast',sub:'the vertical spar',what:'The tall aluminum spar stepped on the cabin top (deck-stepped) or on the keel. Sails hoist up the luff groove on its aft face. The top is the masthead.',use:'Holds the sails up and carries the standing rigging. The mainsail luff slides up its track.',tip:'A "spar" is any pole that supports sail: mast, boom, spreaders.',view:{d:16,th:0.9,ph:1.0}},
 {id:'boom',g:'spars',name:'Boom',sub:'the horizontal spar',what:'The spar along the foot of the mainsail, hinged to the mast at the gooseneck. The outhaul at its far end tensions the foot.',use:'Holds the foot of the mainsail out and lets the mainsheet control it. It swings across the boat in a tack or jibe.',tip:'Duck. An uncontrolled jibe sends the boom across fast; keep your head below boom height when turning downwind.',view:{d:6,th:2.0,ph:1.3}},
 {id:'spreaders',g:'spars',name:'Spreaders',sub:'the struts on the mast',what:'Short struts projecting sideways from the mast, a little over halfway up on a single-spreader rig like this one.',use:'Push the upper shrouds outward so they meet the mast at a better angle, stiffening it sideways.',tip:'Spreader tips are protected with boots so they do not chafe the genoa.',view:{d:6,th:1.0,ph:0.9,y:5.6}},
 {id:'shrouds',g:'standing',name:'Shrouds',sub:'side wires',what:'Wires from the mast down to the chainplates on each side of the hull. The upper shrouds run over the spreader tips to the masthead; the lowers go to the mast at spreader height.',use:'Hold the mast up sideways (athwartships). Standing rigging is fixed; you do not adjust it while sailing.',tip:'Standing rigging = shrouds, forestay, backstay. Running rigging = everything you pull on.',view:{d:9,th:1.4,ph:1.1,y:3.5}},
 {id:'forestay',g:'standing',name:'Forestay (headstay)',sub:'forward wire',what:'The wire from the masthead to the stemhead at the bow. The jib hanks onto it or feeds into a roller-furling foil wrapped around it.',use:'Keeps the mast from falling aft and gives the jib its luff.',tip:'The jib sets on the forestay; the mainsail sets on the mast. That is how you tell them apart from a distance.',view:{d:9,th:0.5,ph:1.1,y:4.5}},
 {id:'backstay',g:'standing',name:'Backstay',sub:'aft wire',what:'The wire from the masthead down to the stern.',use:'Keeps the mast from falling forward and balances the forestay. Adjustable backstays bend the mast to flatten the main.',tip:'On this boat it ends at the transom, clear of the tiller.',view:{d:9,th:3.0,ph:1.1,y:4.5}},
 {id:'halyards',g:'running',name:'Halyards',sub:'lines that hoist',what:'The main halyard and jib halyard run from the head of each sail up over a sheave at the masthead and back down the mast to cleats at its base (or led aft to the cockpit).',use:'Raise and lower the sails. Tension the halyard until the small horizontal wrinkles along the luff just disappear.',tip:'Halyard hoists, sheet trims, outhaul stretches. Those are the three lines you touch most.',view:{d:9,th:1.3,ph:1.1,y:4.5}},
 {id:'mainsheet',g:'running',name:'Mainsheet',sub:'trims the mainsail',what:'A multi-part tackle from the end of the boom down to the traveler car, giving purchase to control the boom under load.',use:'Trims the mainsail in and out. Ease in a gust to spill wind and reduce heel; trim in to point higher.',tip:'When in doubt, let it out. Easing the mainsheet is the first thing to do when overpowered.',view:{d:5,th:2.7,ph:1.3,y:1.5}},
 {id:'jibsheets',g:'running',name:'Jib sheets',sub:'trim the jib',what:'Two lines tied to the clew of the jib, one led down each side deck through a fairlead to a winch in the cockpit.',use:'Trim the jib. Only the leeward sheet (the working sheet) is loaded; the windward one is the lazy sheet. In a tack you release one and haul in the other.',tip:'Fairlead position changes the sheet angle: forward for a fuller, more powerful sail, aft to flatten it.',view:{d:7,th:1.9,ph:1.2}},
 {id:'vang',g:'running',name:'Boom vang',sub:'holds the boom down',what:'A tackle from the base of the mast to a point partway along the boom.',use:'Keeps the boom from lifting when the mainsheet is eased off the wind, controlling twist in the top of the sail.',tip:'Also called a kicker. Loosen it before hoisting the main.',view:{d:4.5,th:1.6,ph:1.3,y:1.8}},
 {id:'toppinglift',g:'running',name:'Topping lift',sub:'supports the boom',what:'A line from the masthead to the end of the boom.',use:'Holds the boom up when the mainsail is down so it does not drop into the cockpit. Slacken it once the sail is set.',tip:'Forgot to ease it? The sail will have a hooked, overly loose leech.',view:{d:8,th:2.3,ph:1.1,y:5}},
 {id:'mainsail',g:'sails',name:'Mainsail',sub:'the main',what:'The big triangular sail behind the mast. Its corners are the head (top), tack (forward lower, at the gooseneck) and clew (aft lower, at the boom end). Its edges are the luff (along the mast), leech (trailing edge) and foot (along the boom).',use:'The main driving sail. It is controlled by the mainsheet, traveler, outhaul, vang and halyard.',tip:'Luff forward, leech aft, foot bottom. Head high, tack forward, clew aft.',view:{d:12,th:2.2,ph:1.2,y:5}},
 {id:'jib',g:'sails',name:'Jib',sub:'the headsail',what:'The triangular sail set forward of the mast on the forestay. A larger one that overlaps the mast is a genoa. Same corner and edge names as the main.',use:'Adds drive and bends the wind onto the back of the main (the slot effect), making both sails work better.',tip:'The jib is trimmed by its sheets; "backing the jib" (holding it to windward) helps push the bow through a slow tack.',view:{d:11,th:0.7,ph:1.2,y:4}},
 {id:'battens',g:'sails',name:'Battens',sub:'stiffeners in the main',what:'Thin flexible strips slid into pockets along the leech of the mainsail.',use:'Support the roach (the curved extra area beyond a straight leech) and stop the leech from fluttering.',tip:'Fold the sail with the battens in, parallel to them, so they do not break.',view:{d:7,th:2.4,ph:1.3,y:5}},

cardBody.addEventListener('click',e=>{ const b=e.target.closest('[data-act],[data-opt]'); if(!b) return;
 if(b.dataset.act==='tour') setMode('tour'); else if(b.dataset.act==='quiz') setMode('quiz');
 else if(b.dataset.act==='prev'){ if(mode==='tour'){ tourStep=Math.max(0,tourStep-1); showTour(); } else select(PARTS[(byId[selected].idx+PARTS.length-1)%PARTS.length].id); }
 else if(b.dataset.act==='next'){ if(mode==='tour'){ tourStep++; if(tourStep>=PARTS.length){ finishTour(); } else showTour(); } else select(PARTS[(byId[selected].idx+1)%PARTS.length].id); }
 else if(b.dataset.act==='explore') setMode('explore');
 else if(b.dataset.act==='restartQuiz') startQuiz();
 else if(b.dataset.act==='nextQ') nextQuestion();
 else if(b.dataset.opt!=null) answerMC(+b.dataset.opt); });
document.querySelectorAll('.chip[data-mode]').forEach(c=>c.addEventListener('click',()=>setMode(c.dataset.mode)));
function setMode(m){ mode=m; document.querySelectorAll('.chip[data-mode]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.mode===m)); card.classList.remove('collapsed');
 if(m==='explore'){ hint.textContent='Drag to orbit · scroll or pinch to zoom · tap any part of the boat'; renderCard(); }
 else if(m==='tour'){ tourStep=0; showTour(); } else startQuiz(); }

/* tour */
let tourStep=0;
function showTour(){ const p=PARTS[tourStep]; select(p.id); tourDone.add(p.id); renderList(); hint.textContent=`Tour · ${tourStep+1} of ${PARTS.length} · the camera flies to each part`;
 cardBody.innerHTML=partHTML(p,`Tour · ${GROUPS.find(g=>g[0]===p.g)[1]}`)+`<div class="row"><button class="btn" data-act="prev" ${tourStep===0?'disabled':''}>◀ Back</button><button class="btn primary" data-act="next">${tourStep===PARTS.length-1?'Finish':'Next ▶'}</button><span class="prog">${tourStep+1} / ${PARTS.length}</span></div>`; }
function finishTour(){ select(null,false); cardBody.innerHTML=`<div class="eyebrow">Tour complete</div><h2>You've walked the whole boat<small>${PARTS.length} parts, bow to masthead</small></h2><p>Standing rigging holds the mast up; running rigging is what you pull on. Halyards hoist, sheets trim. Port is red and left, starboard is green and right. Ready to check it?</p><div class="row"><button class="btn primary" data-act="quiz">Take the quiz</button><button class="btn" data-act="explore">Keep exploring</button></div>`; setView({target:V(0,2.2,0),dist:15,theta:2.3,phi:1.2}); }

/* quiz */
const MCQ=[
 {q:'Which line do you haul on to raise the mainsail?',a:'halyards',opts:['Main halyard','Mainsheet','Boom vang','Topping lift']},
 {q:'Which part keeps the boat from sliding sideways and resists heeling?',a:'keel',opts:['Keel','Rudder','Boom','Backstay']},
 {q:'The wire from the masthead to the bow is the',a:'forestay',opts:['Forestay','Backstay','Upper shroud','Jib halyard']},
 {q:'Which of these is running rigging?',a:'jibsheets',opts:['Jib sheets','Shrouds','Spreaders','Forestay']},
 {q:'Which part holds the boom down when sailing off the wind?',a:'vang',opts:['Boom vang','Topping lift','Outhaul','Traveler']},
 {q:'Telltales streaming aft on both sides of the jib mean',a:'telltales',opts:['The sail is trimmed correctly','You should sheet in','You should bear away','The jib is backed']},
 {q:'Push the tiller toward the sail and the bow',a:'tiller',opts:['Turns up toward the wind','Turns away from the wind','Stops turning','Backs up']},
 {q:'The aft lower corner of a sail is the',a:'mainsail',opts:['Clew','Tack','Head','Leech']},
 {q:'Which part lets you move the boom sideways without changing sheet tension?',a:'traveler',opts:['Traveler','Boom vang','Outhaul','Cunningham']},
 {q:'The struts that push the upper shrouds outward are the',a:'spreaders',opts:['Spreaders','Chainplates','Stanchions','Gooseneck']},
 {q:'The flat vertical surface at the back of the hull is the',a:'stern',opts:['Transom','Stem','Coaming','Sheer']},
 {q:'A line is wrapped around a winch drum',a:'winches',opts:['Clockwise','Counter-clockwise','Either way','Twice, then reversed']},
];
const FINDQ=['keel','rudder','tiller','boom','spreaders','shrouds','forestay','backstay','winches','jib','mainsail','battens','telltales','traveler','vang','halyards','mainsheet','cleats','lifelines','cabin'];
let quiz=null;
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function startQuiz(){ const finds=shuffle([...FINDQ]).slice(0,5).map(id=>({type:'find',a:id})); const mcs=shuffle([...MCQ]).slice(0,5).map(m=>({type:'mc',...m})); quiz={qs:shuffle([...finds,...mcs]),i:0,score:0,answered:false}; select(null,false); setView({target:V(0,2.5,0),dist:14,theta:0.9,phi:1.15}); showQuestion(); }
function showQuestion(){ const q=quiz.qs[quiz.i]; quiz.answered=false; const head=`<div class="eyebrow">Quiz · question ${quiz.i+1} of ${quiz.qs.length} · score ${quiz.score}</div>`;
 if(q.type==='find'){ const p=byId[q.a]; hint.textContent='Quiz: tap the part on the boat (or pick it from the list)'; cardBody.innerHTML=head+`<h2>Tap the ${esc(p.name.toLowerCase())}<small>find it on the boat</small></h2><p>${esc(p.use.split('. ')[0])}.</p><div id="feed"></div>`; }
 else { hint.textContent='Quiz: choose an answer'; const correct=q.opts[0]; const opts=shuffle(q.opts.map((o,i)=>({o,ok:i===0}))); q._opts=opts; cardBody.innerHTML=head+`<h2>${esc(q.q)}</h2><div class="opts">${opts.map((o,i)=>`<button class="opt" data-opt="${i}">${esc(o.o)}</button>`).join('')}</div><div id="feed"></div>`; } }
function answerMC(i){ if(quiz.answered) return; quiz.answered=true; const q=quiz.qs[quiz.i]; const ok=q._opts[i].ok; if(ok) quiz.score++; document.querySelectorAll('.opt').forEach((b,j)=>{ if(q._opts[j].ok) b.classList.add('ok'); else if(j===i) b.classList.add('no'); });
 select(q.a,true); feedback(ok, ok?'Correct.':'Not quite. The answer is highlighted on the boat.'); }
function onPick(id){ if(mode!=='quiz'){ select(id); return; } const q=quiz.qs[quiz.i]; if(q.type!=='find'||quiz.answered) return; quiz.answered=true; const ok=id===q.a; if(ok) quiz.score++; select(q.a,true);
 feedback(ok, ok?`Correct, that's the ${byId[q.a].name.toLowerCase()}.`:`That was the ${byId[id].name.toLowerCase()}. The ${byId[q.a].name.toLowerCase()} is highlighted now.`); }
function feedback(ok,text){ const f=document.getElementById('feed'); if(!f) return; f.innerHTML=`<p class="feed ${ok?'ok':'no'}">${esc(text)}</p><div class="row"><button class="btn primary" data-act="nextQ">${quiz.i===quiz.qs.length-1?'See score':'Next question ▶'}</button></div>`; }
function nextQuestion(){ quiz.i++; if(quiz.i>=quiz.qs.length){ const s=quiz.score,n=quiz.qs.length; select(null,false); cardBody.innerHTML=`<div class="eyebrow">Quiz result</div><div class="score">${s} / ${n}</div><p>${s===n?'Perfect. You know this boat.':s>=n*0.7?'Solid. Review the ones you missed in the tour and go again.':'Take the tour once more, then try again. Repetition is what makes the names stick.'}</p><div class="row"><button class="btn primary" data-act="restartQuiz">Another round</button><button class="btn" data-act="tour">Take the tour</button><button class="btn" data-act="explore">Explore</button></div>`; return; } select(null,false); showQuestion(); }

/* sails toggle, quality toggle */
const sailsBtn=document.getElementById('sailsBtn'); sailsBtn.addEventListener('click',()=>{ sailsGroup.visible=!sailsGroup.visible; sailsBtn.setAttribute('aria-pressed',sailsGroup.visible); });
const qualBtn=document.getElementById('qualBtn');
function applyQuality(){ renderer.setPixelRatio(quality?Math.min(devicePixelRatio,2):Math.min(devicePixelRatio,1.25)); renderer.shadowMap.enabled=quality; sun.castShadow=quality; sun.shadow.mapSize.set(quality?2048:1024,quality?2048:1024); if(sun.shadow.map){sun.shadow.map.dispose(); sun.shadow.map=null;} buildWater(); qualBtn.textContent=quality?'HQ':'LQ'; qualBtn.setAttribute('aria-pressed',quality); qualBtn.title='Graphics quality: '+(quality?'high':'low (faster)'); scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; }); }
qualBtn.addEventListener('click',()=>{ quality=!quality; applyQuality(); try{localStorage.setItem('kpe-q',quality?'1':'0');}catch(e){} });
try{ const q=localStorage.getItem('kpe-q'); if(q!=null) quality=q==='1'; }catch(e){}
applyQuality();

/* resize, loop */
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); camera.fov=w<h?52:42; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let t0=performance.now();
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.05,(now-t0)/1000); t0=now;
 const k=1-Math.pow(0.0025,dt); cam.target.lerp(cam.tgt.target,k); cam.dist+=(cam.tgt.dist-cam.dist)*k; cam.theta+=(cam.tgt.theta-cam.theta)*k; cam.phi+=(cam.tgt.phi-cam.phi)*k;
 if(!reduce){ waterUniforms.t.value=now/1000; const r=now/1000; boat.rotation.z=Math.sin(r*0.7)*0.012; boat.rotation.x=Math.sin(r*0.45)*0.006; boat.position.y=Math.sin(r*0.6)*0.03; }
 applyCam(); updateLabel(now); renderer.render(scene,camera); }
setView({target:V(0,2.2,0),dist:16,theta:0.75,phi:1.2},true); setView({target:V(0,2.2,0),dist:13,theta:0.95,phi:1.18});
renderList(); renderCard();
requestAnimationFrame(loop);
})();
</script>

</body></html>
